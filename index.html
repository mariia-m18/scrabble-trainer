<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrabble Trainer</title>
<style>
  :root { color-scheme: light; }
  body { font: 16px/1.4 system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 8px; background: #fff; color: #222; }
  button, input, select { font: inherit; padding: 8px 12px; }
  nav { display: flex; gap: 8px; margin-bottom: 12px; }
  nav button { flex: 1; }
  nav [aria-pressed=true] { font-weight: bold; border-bottom: 3px solid #222; }
  form { display: flex; gap: 8px; margin: 8px 0; }
  form input { flex: 1; min-width: 0; text-transform: uppercase; }
  .rack { display: flex; gap: 4px; margin: 12px 0; }
  .t { background: #f3deb0; border: 1px solid #b99; border-radius: 4px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 22px; font-weight: bold; position: relative; }
  .t sub { position: absolute; right: 3px; bottom: 1px; font-size: 10px; font-weight: normal; }
  #board { display: grid; grid-template-columns: repeat(15, 1fr); border: 1px solid #999; }
  #board button { aspect-ratio: 1; padding: 0; border: 1px solid #ddd; border-radius: 0; background: #f7f7f2; color: #222; font-size: min(3.8vw, 18px); font-weight: bold; }
  #board .b { font-size: min(2.7vw, 12px); }
  #board .b3W { background: #e6d9ea; color: #8a1f9c; } #board .b2W { background: #d5def0; color: #3d5a96; }
  #board .b3L { background: #d8e5cc; color: #4d6436; } #board .b2L { background: #f1ebc4; color: #7a5a22; }
  #board .tile { background: #f3deb0; }
  #board .new { background: #ffe24d; }
  #board .sel { outline: 3px solid #222; outline-offset: -3px; }
  #rack .t, #board .mine { touch-action: none; user-select: none; cursor: grab; }
  #board .over { outline: 3px solid #2a7; outline-offset: -3px; }
  .float { position: fixed; pointer-events: none; z-index: 9; box-shadow: 0 4px 10px #0004; }
  ol { padding-left: 28px; }
  #bList button { margin: 2px 0; }
  .hint { color: #555; font-size: 14px; }
</style>

<p id="load">Loading dictionary</p>
<main id="app" hidden>
  <nav>
    <button id="tabU" aria-pressed="true">Unscramble</button>
    <button id="tabB" aria-pressed="false">Board</button>
  </nav>

  <section id="U">
    <label>Number of letters
      <select id="len"><option>5<option>6<option selected>7<option>8</select>
    </label>
    <div id="letters" class="rack"></div>
    <form id="uForm">
      <input id="uIn" aria-label="Your word" placeholder="Longest word you can find!" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button>Check</button>
    </form>
    <button id="uShuffle">Shuffle</button>
    <button id="uShow">Show answers</button>
    <button id="uNext">New letters</button>
    <p id="uMsg" aria-live="polite"></p>
    <ol id="uList"></ol>
  </section>

  <section id="B" hidden>
    <div id="board"></div>
    <div id="rack" class="rack"></div>
    <p class="hint">Drag tiles from your rack onto the board, then press Play. Tap a placed tile to send it back.</p>
    <p class="hint">Or tap the square where you want your word to start (tap again to switch across / down) and type the whole word, including letters already on the board :)</p>
    <p id="bSel" class="hint"></p>
    <form id="bForm">
      <input id="bIn" aria-label="Your word" placeholder="Your word" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button>Play</button>
    </form>
    <button id="bClear">Return all tiles</button>
    <button id="bShow">Show best plays</button>
    <button id="bNext">New board</button>
    <p id="bMsg" aria-live="polite"></p>
    <ol id="bList"></ol>
  </section>
</main>

<script src="engine.js"></script>
<script>
const $ = id => document.getElementById(id);
const clean = s => s.toUpperCase().replace(/[^A-Z]/g, '');
const tiles = s => [...s].map(c => `<span class="t">${c}<sub>${VALS[c]}</sub></span>`).join('');
let list, dict;

// Unscramble
let uL, uAns;
function uNew() {
  uL = scramble(list, +$('len').value);
  // best score first, then longest
  uAns = fits(list, uL).sort((a, b) => base(b) - base(a) || b.length - a.length || (a < b ? -1 : 1));
  $('letters').innerHTML = tiles(uL);
  $('uIn').value = $('uMsg').textContent = $('uList').innerHTML = '';
}
const base = w => [...w].reduce((s, c) => s + VALS[c], 0); // this calculates the base score of a word using tile values only, no board bonuses
function uShow() { $('uList').innerHTML = uAns.slice(0, 30).map(w => `<li>${w} – ${base(w)}</li>`).join(''); }
$('uForm').onsubmit = e => {
  e.preventDefault();
  const w = clean($('uIn').value);
  if (!uAns.includes(w)) return $('uMsg').textContent = `${w || 'That'} is not a word from these letters. Check your spelling, or click on show the answers.`;
  $('uMsg').textContent = `${w} is valid (${w.length} letters). Longest possible: ${uAns[0].length}.`;
  uShow();
};
$('uShuffle').onclick = () => $('letters').innerHTML = tiles(uL = shuffle(uL.split('')).join(''));
$('uShow').onclick = uShow;
$('uNext').onclick = $('len').onchange = uNew;

// Board
let g, sel = null, shown = null; // position, start square {c, d}, solution being previewed
let placed = {}, drag = null, over = null, dropT = 0; // cell -> letter, tile in hand, cell under it
function overlay() { // cell -> letter for the dragged tiles, the typed word or the previewed solution
  const o = {};
  if (shown) for (const [c, ch] of shown.tiles) o[c] = ch;
  else if (Object.keys(placed).length) Object.assign(o, placed);
  else if (sel) {
    let c = sel.c;
    for (const ch of clean($('bIn').value)) {
      if (c > 224 || (!sel.d && c !== sel.c && c % 15 === 0)) break; // ran off the board
      if (!g.board[c]) o[c] = ch;
      c += sel.d ? 15 : 1;
    }
  }
  return o;
}
function bDraw() {
  // redraw the board with any typed or previewed letters, premium-square styles, and the selected start square
  const o = overlay(), prem = { T: '3W', D: '2W', t: '3L', d: '2L' };
  $('board').innerHTML = g.board.map((ch, c) => {
    const l = ch || o[c] || '', here = sel && sel.c === c, bonus = prem[PREM[c]] || '';
    const cls = (ch ? 'tile' : o[c] ? 'tile new' + (placed[c] ? ' mine' : '') : bonus && 'b b' + bonus) + (here ? ' sel' : '');
    return `<button data-c="${c}" class="${cls}" aria-label="row ${Math.floor(c / 15) + 1} column ${c % 15 + 1} ${l || bonus || 'empty'}">${l || (here ? (sel.d ? '↓' : '→') : bonus)}</button>`;
  }).join('');
  $('bSel').textContent = sel ? `Start: row ${Math.floor(sel.c / 15) + 1}, column ${sel.c % 15 + 1}, going ${sel.d ? 'down' : 'across'}.` : '';
  let r = g.rack; // the rack minus tiles on the board or in hand
  for (const ch of [...Object.values(placed), drag && drag.ch]) if (ch) r = r.replace(ch, '');
  $('rack').innerHTML = tiles(r);
}
// the word the dragged tiles spell, like [word, d, line, start]
function spelled() {
  const cs = Object.keys(placed).map(Number).sort((a, b) => a - b), row = c => Math.floor(c / 15), col = c => c % 15;
  const has = c => g.board[c] || placed[c];
  let d = cs.every(c => row(c) === row(cs[0])) ? 0 : cs.every(c => col(c) === col(cs[0])) ? 1 : -1;
  if (d < 0) return 'the tiles must be in one row or column';
  if (cs.length === 1 && !(col(cs[0]) > 0 && has(cs[0] - 1)) && !(col(cs[0]) < 14 && has(cs[0] + 1))) d = 1;
  const line = d ? col(cs[0]) : row(cs[0]), pos = c => d ? row(c) : col(c);
  let s = pos(cs[0]), e = pos(cs[cs.length - 1]), w = '';
  while (s > 0 && has(at(d, line, s - 1))) s--;
  while (e < 14 && has(at(d, line, e + 1))) e++;
  for (let i = s; i <= e; i++) {
    if (!has(at(d, line, i))) return 'there is a gap between your tiles';
    w += has(at(d, line, i));
  }
  return w.length < 2 ? 'a word needs at least two letters' : [w, d, line, s];
}
// drag with pointer events, floating the letter above your finger
// touch and mouse both still work
function lift(e, ch, from) {
  e.preventDefault();
  if (from != null) delete placed[from];
  const el = document.createElement('span');
  el.className = 't float'; el.innerHTML = `${ch}<sub>${VALS[ch]}</sub>`;
  document.body.append(el);
  drag = { ch, from, el, up: e.pointerType === 'touch' ? 40 : 0 };
  sel = shown = null; $('bIn').value = '';
  bDraw(); hover(e);
}
function hover(e) {
  const x = e.clientX, y = e.clientY - drag.up, t = document.elementFromPoint(x, y), c = t && t.closest('#board button');
  drag.el.style.left = x - 20 + 'px'; drag.el.style.top = y - 20 + 'px';
  if (over !== c) { if (over) over.classList.remove('over'); if (over = c) c.classList.add('over'); }
}
function drop(ok) {
  if (!drag) return;
  const c = over && +over.dataset.c;
  if (ok && over && c !== drag.from && !g.board[c] && !placed[c]) placed[c] = drag.ch;
  drag.el.remove(); drag = over = null; dropT = Date.now();
  bDraw();
}
$('rack').onpointerdown = e => { const t = e.target.closest('.t'); if (t) lift(e, t.firstChild.textContent, null); };
$('board').onpointerdown = e => { const c = e.target.dataset.c; if (c != null && placed[c]) lift(e, placed[c], +c); };
addEventListener('pointermove', e => drag && hover(e));
addEventListener('pointerup', () => drop(true));
addEventListener('pointercancel', () => drop(false));
function bShow() {
  $('bList').innerHTML = g.moves.slice(0, 10).map((m, i) => `<li><button data-i="${i}">${m.word} – ${m.score}</button></li>`).join('');
}
function bNew() {
  $('bMsg').textContent = 'Making a board';
  setTimeout(() => {
    g = randomBoard(list, dict); sel = shown = null; placed = {};
    $('bIn').value = $('bMsg').textContent = $('bList').innerHTML = '';
    bDraw();
  }, 30);
}
$('board').onclick = e => {
  const c = e.target.dataset.c;
  if (c == null || Date.now() - dropT < 400) return;
  sel = sel && sel.c === +c ? { c: +c, d: 1 - sel.d } : { c: +c, d: 0 };
  shown = null; bDraw();
};
$('bIn').oninput = () => { shown = null; placed = {}; bDraw(); };
$('bList').onclick = e => {
  const i = e.target.dataset.i;
  if (i != null) { shown = g.moves[i]; sel = null; placed = {}; bDraw(); $('board').scrollIntoView({ behavior: 'smooth' }); }
};
$('bForm').onsubmit = e => {
  e.preventDefault();
  let w, d, line, start;
  if (Object.keys(placed).length) {
    const p = spelled();
    if (typeof p === 'string') return $('bMsg').textContent = `Not playable: ${p}.`;
    [w, d, line, start] = p;
  } else {
    if (!sel) return $('bMsg').textContent = 'Drag tiles onto the board, or tap a start square and type a word.';
    const r = Math.floor(sel.c / 15), col = sel.c % 15;
    w = clean($('bIn').value); d = sel.d; line = d ? col : r; start = d ? r : col;
  }
  const m = play(g.board, dict, g.rack, w, d, line, start);
  if (typeof m === 'string') return $('bMsg').textContent = `Not playable: ${m}.`;
  const rank = g.moves.findIndex(x => x.score <= m.score) + 1;
  $('bMsg').textContent = `${w} would score ${m.score}. The best play scores ${g.moves[0].score}. Yours ranks #${rank} of ${g.moves.length}. Tap any word below to see where it would play.`;
  bShow();
};
$('bClear').onclick = () => { placed = {}; $('bIn').value = ''; bDraw(); };
$('bShow').onclick = bShow;
$('bNext').onclick = bNew;

// Tabs and startup
function tab(b) {
  $('U').hidden = b; $('B').hidden = !b;
  $('tabU').setAttribute('aria-pressed', !b); $('tabB').setAttribute('aria-pressed', b);
  if (b && !g) bNew();
}
$('tabU').onclick = () => tab(false);
$('tabB').onclick = () => tab(true);

fetch('words.txt').then(r => { if (!r.ok) throw 0; return r.text(); }).then(t => {
  list = t.toUpperCase().split(/\s+/).filter(w => /^[A-Z]{2,15}$/.test(w));
  dict = new Set(list);
  $('load').hidden = true; $('app').hidden = false;
  uNew();
}).catch(() => $('load').textContent = 'Couldn\'t load words.txt. Open this page from a web server');
</script>
</html>
